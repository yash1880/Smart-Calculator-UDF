<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Calculator</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f7f2ec;
    color: #333;
    padding: 20px;
}
h1 {
    text-align: center;
    color: #222;
}
.container {
    width: 420px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
}
section {
    margin-bottom: 25px;
    padding-bottom: 12px;
    border-bottom: 1px solid #ddd;
}
label {
    display: block;
    margin-top: 5px;
}
input, select {
    width: 95%;
    padding: 6px;
    margin-top: 4px;
    border-radius: 4px;
    border: 1px solid #ccc;
}
button {
    margin-top: 10px;
    padding: 8px 15px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.human-output {
    margin-top: 8px;
    padding: 8px;
    background: #fffbe6;
    border-left: 4px solid #ffc107;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #444;
    border-radius: 5px;
    transition: all 0.3s ease;
    max-height: 200px;
    overflow-y: auto;
}
.human-output p {
    margin: 3px 0;
    font-weight: bold;
    font-size: 16px;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
}
@keyframes fadeIn {
    to { opacity: 1; }
}
</style>
</head>
<body>

    <h1>Smart Calculator</h1>
        <div class="container">

<!-- Arithmetic -->
<section>
<h3><img src="https://twemoji.maxcdn.com/v/latest/72x72/31-20e3.png" alt="1️⃣" width="20">.    Arithmetic Calculator</h3>
<label>First Number:</label>
<input type="number" id="num1">
<label>Second Number:</label>
<input type="number" id="num2">
<label>Operator:</label>
<select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
    <option value="%">%</option>
</select>
<button onclick="doArithmetic()">Calculate</button>
<div id="outputArithmetic" class="human-output"></div>
</section>

<!-- Square & Cube -->
<section>
<h3><img src="https://twemoji.maxcdn.com/v/latest/72x72/32-20e3.png" alt="2️⃣" width="20"> Square & Cube</h3>
<label>Number:</label>
<input type="number" id="num3">
<button onclick="calcSquareCube()">Find</button>
<div id="outputSquareCube" class="human-output"></div>
</section>

<!-- Factorial -->
<section>
<h3><img src="https://twemoji.maxcdn.com/v/latest/72x72/33-20e3.png" alt="3️⃣" width="20"> Factorial</h3>
<label>Number:</label>
<input type="number" id="num4">
<button onclick="calcFactorial()">Find Factorial</button>
<div id="outputFactorial" class="human-output"></div>
</section>

<!-- Even / Odd -->
<section>
<h3><img src="https://twemoji.maxcdn.com/v/latest/72x72/34-20e3.png" alt="4️⃣" width="20"> Even / Odd Checker</h3>
<label>Number:</label>
<input type="number" id="num5">
<button onclick="checkEvenOddNum()">Check</button>
<div id="outputEvenOdd" class="human-output"></div>
</section>

</div>

<script>
// === 1. Arithmetic ===
function arithmeticCalc(a,b,op){
    let res;
    if(op === '+') res = a + b;
    else if(op === '-') res = a - b;
    else if(op === '*') res = a * b;
    else if(op === '/') res = (b !== 0)? a / b : 'Error';
    else if(op === '%') res = a % b;
    else res = 'Invalid Operator';
    return res;
}
function doArithmetic(){
    let a = parseFloat(document.getElementById('num1').value);
    let b = parseFloat(document.getElementById('num2').value);
    let op = document.getElementById('operator').value;
    let ans = arithmeticCalc(a,b,op);

    let output = document.getElementById('outputArithmetic');
    let p = document.createElement('p');
    p.textContent = `${a} ${op} ${b} = ${ans}`;
    output.appendChild(p);
    output.scrollTop = output.scrollHeight;
}

// === 2. Square & Cube ===
function square(n){ return n*n; }
function cube(n){ return n*n*n; }
function calcSquareCube(){
    let n = parseFloat(document.getElementById('num3').value);
    let sq = square(n);
    let cu = cube(n);

    let output = document.getElementById('outputSquareCube');
    let p = document.createElement('p');
    p.textContent = `Square: ${sq} | Cube: ${cu}`;
    output.appendChild(p);
    output.scrollTop = output.scrollHeight;
}

// === 3. Factorial ===
function factorial(n){
    if(n === 0 || n === 1) return 1;
    else return n * factorial(n-1);
}
function calcFactorial(){
    let n = parseInt(document.getElementById('num4').value);
    let res = factorial(n);

    let output = document.getElementById('outputFactorial');
    let p = document.createElement('p');
    p.textContent = `${n}! = ${res}`;
    output.appendChild(p);
    output.scrollTop = output.scrollHeight;
}

// === 4. Even / Odd ===
function checkEvenOdd(n){ return (n%2===0)? 'Even':'Odd'; }
function checkEvenOddNum(){
    let n = parseInt(document.getElementById('num5').value);
    let msg = checkEvenOdd(n);

    let output = document.getElementById('outputEvenOdd');
    let p = document.createElement('p');
    p.textContent = `${n} is ${msg}`;
    output.appendChild(p);
    output.scrollTop = output.scrollHeight;
}
</script>

</body>
</html>
